<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>虚拟环境工作区图标预览</title>
<style>
  body{margin:0;font:13px/1.6 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif}
  .panel{padding:24px}
  .light{background:#f4f6f8;color:#1f1f1f}
  .dark{background:#1b1e24;color:#f2f4f7}
  h2{margin:0 0 16px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.6}
  .row{display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px}
  .cell span{font-size:11px;opacity:.55}
  .ctx{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:6px 10px}
  .light .ctx{border:1px solid rgba(0,0,0,.12);background:#fff}
  .dark .ctx{border:1px solid rgba(255,255,255,.16);background:#23272f}
  /* the client-side inline icon uses currentColor */
  .brand{color:#4176e6}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;border:1px solid #4176e6;color:#4176e6;border-radius:999px;padding:1px 7px}
</style>
</head>
<body>

<section class="panel light">
  <h2>浅色主题</h2>
  <div class="row">
    <div class="cell">
      <svg viewBox="0 0 22 16" width="12" height="9" class="brand"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 3.3 1.7 8l3.2 4.7"/><path d="M17.1 3.3 20.3 8l-3.2 4.7"/></g><path d="M7.1 4.9h2.9l1.3 1.5h4.6c.6 0 1 .4 1 1v4.4c0 .6-.4 1-1 1H7.1c-.6 0-1-.4-1-1V5.9c0-.6.4-1 1-1z" fill="currentColor"/></svg>
      <span>12px 行内徽标</span>
    </div>
    <div class="cell">
      <svg viewBox="0 0 22 16" width="15" height="11" class="brand"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 3.3 1.7 8l3.2 4.7"/><path d="M17.1 3.3 20.3 8l-3.2 4.7"/></g><path d="M7.1 4.9h2.9l1.3 1.5h4.6c.6 0 1 .4 1 1v4.4c0 .6-.4 1-1 1H7.1c-.6 0-1-.4-1-1V5.9c0-.6.4-1 1-1z" fill="currentColor"/></svg>
      <span>15px 标题栏 / 切换器</span>
    </div>
    <div class="cell">
      <span class="badge"><svg viewBox="0 0 22 16" width="12" height="9"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 3.3 1.7 8l3.2 4.7"/><path d="M17.1 3.3 20.3 8l-3.2 4.7"/></g><path d="M7.1 4.9h2.9l1.3 1.5h4.6c.6 0 1 .4 1 1v4.4c0 .6-.4 1-1 1H7.1c-.6 0-1-.4-1-1V5.9c0-.6.4-1 1-1z" fill="currentColor"/></svg>虚拟环境</span>
      <span>工作区列表徽标</span>
    </div>
    <div class="cell">
      <div class="ctx"><svg viewBox="0 0 22 16" width="15" height="11" class="brand"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 3.3 1.7 8l3.2 4.7"/><path d="M17.1 3.3 20.3 8l-3.2 4.7"/></g><path d="M7.1 4.9h2.9l1.3 1.5h4.6c.6 0 1 .4 1 1v4.4c0 .6-.4 1-1 1H7.1c-.6 0-1-.4-1-1V5.9c0-.6.4-1 1-1z" fill="currentColor"/></svg><span>alpine-cn-1g</span><span style="opacity:.6">2</span></div>
      <span>输入框容器切换器</span>
    </div>
    <div class="cell">
      <svg viewBox="0 0 64 64" width="40" height="40"><title>插件图标</title><g fill="none" stroke="#4176e6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 15 4 33l11 18"/><path d="M49 15l11 18-11 18"/></g><path d="M20 20h8l3 4h13a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H20a2 2 0 0 1-2-2V22a2 2 0 0 1 2-2z" fill="#4176e6"/></svg>
      <span>插件卡片 icon.svg</span>
    </div>
  </div>
</section>

<section class="panel dark">
  <h2>深色主题</h2>
  <div class="row">
    <div class="cell">
      <svg viewBox="0 0 22 16" width="12" height="9" style="color:#7aa7f0"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 3.3 1.7 8l3.2 4.7"/><path d="M17.1 3.3 20.3 8l-3.2 4.7"/></g><path d="M7.1 4.9h2.9l1.3 1.5h4.6c.6 0 1 .4 1 1v4.4c0 .6-.4 1-1 1H7.1c-.6 0-1-.4-1-1V5.9c0-.6.4-1 1-1z" fill="currentColor"/></svg>
      <span>12px</span>
    </div>
    <div class="cell">
      <svg viewBox="0 0 22 16" width="15" height="11" style="color:#7aa7f0"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 3.3 1.7 8l3.2 4.7"/><path d="M17.1 3.3 20.3 8l-3.2 4.7"/></g><path d="M7.1 4.9h2.9l1.3 1.5h4.6c.6 0 1 .4 1 1v4.4c0 .6-.4 1-1 1H7.1c-.6 0-1-.4-1-1V5.9c0-.6.4-1 1-1z" fill="currentColor"/></svg>
      <span>15px</span>
    </div>
    <div class="cell">
      <span class="badge" style="border-color:#7aa7f0;color:#7aa7f0"><svg viewBox="0 0 22 16" width="12" height="9"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 3.3 1.7 8l3.2 4.7"/><path d="M17.1 3.3 20.3 8l-3.2 4.7"/></g><path d="M7.1 4.9h2.9l1.3 1.5h4.6c.6 0 1 .4 1 1v4.4c0 .6-.4 1-1 1H7.1c-.6 0-1-.4-1-1V5.9c0-.6.4-1 1-1z" fill="currentColor"/></svg>虚拟环境</span>
      <span>工作区列表徽标</span>
    </div>
    <div class="cell">
      <div class="ctx"><svg viewBox="0 0 22 16" width="15" height="11" style="color:#7aa7f0"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 3.3 1.7 8l3.2 4.7"/><path d="M17.1 3.3 20.3 8l-3.2 4.7"/></g><path d="M7.1 4.9h2.9l1.3 1.5h4.6c.6 0 1 .4 1 1v4.4c0 .6-.4 1-1 1H7.1c-.6 0-1-.4-1-1V5.9c0-.6.4-1 1-1z" fill="currentColor"/></svg><span>alpine-cn-1g</span><span style="opacity:.6">2</span></div>
      <span>输入框容器切换器</span>
    </div>
  </div>
</section>

</body>
</html>
